# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Strip HTML comments from build output
        run: python3 tools/strip-html-comments.py _site
      - name: Verify no HTML comments are published
        run: python3 tools/strip-html-comments.py --check _site
      - name: Redline lint (rendered HTML chrome)
        # 查 build 產物，不查原始碼：站名／站說明是 build 時才注入每一頁的，
        # 只審 markdown 看不到，過去就是這樣漏掉的。
        # 這一步是 chrome 快篩：_config.yml 的 title/description ＋ 每頁 meta ＋ feed 頻道層。
        run: python3 tools/redline_lint_site.py --site-root _site
      - name: Redline lint (build output, fail-closed)
        # 區塊級全面閘。位置是刻意的：在 upload-pages-artifact 之前。
        # 放到 deploy 之後等於還是 post-deploy —— 違規已經上線了才發現，白做。
        # 非 0 即中斷整個 workflow，deploy job 因 needs: build 不會執行。
        # 禁止在這裡加 `|| true` 或 continue-on-error：閘的價值全在它會擋。
        run: >-
          python3 tools/redline_lint_site.py
          --build-root _site
          --rules tools/redline_rules.json
          --baseline tools/redline_baseline.json
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
