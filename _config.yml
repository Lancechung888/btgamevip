# 網站基本資訊
# title / description 是全站 chrome：會被注入每一頁的 <title> 尾綴、og:site_name、
# feed 標題、頁首站名與頁尾。禁折名單的遊戲頁面也吃得到，所以這兩行必須零折扣宣稱
# ——折扣宣稱只留在允許款的 page-level。改動前先跑 tools/redline_lint_site.py。
title: "BT 手遊情報站｜台灣手遊儲值攻略與下載入口"
description: "台灣手遊情報站：U2game 平台介紹、遊戲版本差異與下載入口，儲值教學、活動與攻略整理一次看。"

# 重要：必須填寫你的完整網址，Sitemap 才能生成正確連結
url: "https://btgamevip.com" 

# 佈景主題
theme: minima

# 允許未來時間貼文建置（每日發布：貼文日期可能領先 runner 的 UTC 時鐘）
future: true

# 沒有 timezone: 設定＝建置以 runner 的 UTC 為準，這是刻意保留的現況。
# 後果：front matter 寫 `date: YYYY-MM-DD 0X:XX +0800`（台北凌晨）的貼文，
# 換算 UTC 會退一天，永久連結的 /年/月/日 因此比檔名日期早一天。
# 全站目前有 20 篇處於這個狀態，且都已上線、已進 sitemap。
#
# 不要為了「對齊檔名」而補上 timezone: Asia/Taipei ——那會一次改掉這 20 篇的
# 永久連結，等同 20 個 URL 搬家；沒有配套 301 就是把既有索引與外部連結全部打掉，
# 傷害遠大於日期好看。要改，必須先有轉址方案並經 Board 裁示。
#
# 寫內鏈時的唯一正解＝以 sitemap.xml 上的實際網址為準，不要照檔名日期自己拼。

# 外掛清單（新增了 jekyll-sitemap）
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# 版型導覽列：明確指定哪幾頁進 minima 導覽列，並固定順序。
# 不指定時 minima 會列出「所有帶 title 的 site.pages」，導覽列內容會隨新增頁面漂移，
# 而且長 SEO 標題會原樣塞進導覽列。這三頁是全站三個主要入口（品牌／遊戲／文章），
# 它們各自的 front matter 另外帶了短 title 供導覽列顯示。
header_pages:
  - u2game/index.html
  - games/index.html
  - blog/index.html

# 分類與標籤設定（可選，對 SEO 更有利）
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# 排除 Netlify 專屬檔（主站建置改 GitHub Pages）與內部工作文件（不對外發布）
exclude:
  - netlify
  - netlify.toml
  - cf-pages
  - tools
  - SEO_KEYWORD_RESEARCH.md
  - SEO-7DAY-PLAN.md
  - SEO_GEO_CONTENT_MATRIX_7D.md
  - CONTENT_QUALITY_FRAMEWORK.md
